name: Rustlings CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test completed exercises
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rustlings
        run: cargo install rustlings --locked

      
      - name: Verify completed exercises
        shell: bash
        run: |
          set -euo pipefail

          file=".rustlings-state.txt"

          if [[ ! -f "$file" ]]; then
            echo "::error::File $file not found"
            exit 1
          fi

          while IFS= read -r exercise || [[ -n "$exercise" ]]; do
            # remove blank lines 
            exercise="$(echo "$exercise" | xargs)"

            # skip the useless line 
            [[ -z "$exercise" ]] && continue
            [[ "$exercise" == "DON'T EDIT THIS FILE!"* ]] && continue

            echo "::group::Testing $exercise"
            rustlings run "$exercise"
            echo "::endgroup::"
          done < "$file"

